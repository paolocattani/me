# wrangler.toml
name = "me"
compatibility_date = "2026-01-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Astro Cloudflare adapter entry (SSR routes e.g. blog + R2)
main = "./dist/_worker.js/index.js"

# Static assets from Astro build; `.assetsignore` excludes `_worker.js` / `_routes.json`
[assets]
directory = "./dist"
binding = "ASSETS"

# Custom domains
[[routes]]
pattern = "www.paolocattani.me"
custom_domain = true
zone_name = "paolocattani.me"
[[routes]]
pattern = "paolocattani.me"
custom_domain = true
zone_name = "paolocattani.me"

# R2 bucket for blog posts - create the bucket in Cloudflare Dashboard first
[[r2_buckets]]
binding = "BLOG_BUCKET"
bucket_name = "paolocattani-blog"
